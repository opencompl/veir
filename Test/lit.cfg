import lit.formats
import subprocess
import lit.util
import os
import re
import sys
from pathlib import Path

config.test_source_root = os.path.dirname(__file__)
config.name = "VeIR"

# workaround lit scrubbing the environment -- on MacOS a non-Apple
# clang needs these to find system headers
for _v in ("SDKROOT", "CPATH"):
    if os.environ.get(_v):
        config.environment[_v] = os.environ[_v]
config.suffixes = ['.mlir', '.c', '.ll']

for tool in ('clang', 'opt', 'mlir-translate', 'mlir-opt'):
    if lit.util.which(tool):
        config.available_features.add(tool)

veir_root = Path(config.test_source_root).parent
config.test_format = lit.formats.ShTest(preamble_commands=[f"cd {veir_root}"])
exe_suffix = ".exe" if os.name == "nt" else ""
config.substitutions.append(('veir-opt', f".lake/build/bin/veir-opt{exe_suffix}"))
config.substitutions.append(('veir-interpret', f".lake/build/bin/veir-interpret{exe_suffix}"))
config.substitutions.append(('veir2mir', f".lake/build/bin/veir2mir{exe_suffix}"))
config.substitutions.append(('run-benchmarks', f".lake/build/bin/run-benchmarks{exe_suffix}"))
config.substitutions.append(("VEIR_ROUNDTRIP", f".lake/build/bin/veir-opt{exe_suffix} --print-op-generic %s | .lake/build/bin/veir-opt{exe_suffix} --print-op-generic | filecheck %s"))
config.substitutions.append(("VEIR_UNREGISTERED_ROUNDTRIP", f".lake/build/bin/veir-opt{exe_suffix} --print-op-generic %s --allow-unregistered-dialect | .lake/build/bin/veir-opt{exe_suffix} --print-op-generic --allow-unregistered-dialect | filecheck %s"))

# `LLUBI` and `ALIVE_EXEC` run a cross-check against the test's own `CHECK` lines;
# `LLUBI_CHECK` and `ALIVE_EXEC_CHECK` check the tool's output against `LLUBI:`
# and `ALIVE_EXEC:` lines instead, for a test where the tool is known to differ.
# The bare names must not match inside `--check-prefix=LLUBI`, which the
# `_CHECK` expansion introduces before they are substituted.
# The cross-checks run only at the tool versions CI has, which
# `.github/docker/namespace-base-image.Dockerfile` builds; any other version is
# ignored, as if the tool were absent, unless `lit -Dforce-cross-checks=1` asks
# for it. The scripts report the version with `--version`: llubi has none of
# its own, so its LLVM is pinned, and alive-exec reports its Alive2 commit. To
# move to a new version, change the image and the pin together.
cross_check_versions = {'llubi': 'LLVM 23.1.2', 'alive-exec': '01a5ec4'}
force_cross_checks = lit_config.params.get('force-cross-checks') is not None

def cross_check_tool(tool, script):
    """The command running `Tools/<script>` if `tool` is present at its pinned
    version, or at any version when forced, else None; either way, say so."""
    command = f"{sys.executable} {veir_root}/Tools/{script}"
    result = subprocess.run([sys.executable, f"{veir_root}/Tools/{script}", "--version"],
                            capture_output=True, text=True)
    version = result.stdout.strip()
    pinned = cross_check_versions[tool]
    if result.returncode != 0:
        print(f"'{tool}' not found. Skipping {tool} cross-checks")
        return None
    if version != pinned and not force_cross_checks:
        print(f"'{tool}' at {version} detected, but the tests are pinned to {pinned}. Skipping {tool} cross-checks")
        return None
    if version != pinned:
        print(f"'{tool}' at {version} detected, not the pinned {pinned}. Running {tool} cross-checks anyway, as forced")
    else:
        print(f"'{tool}' at {version} detected. Running {tool} cross-checks")
    config.available_features.add(tool)
    return command

llubi_interpret = cross_check_tool('llubi', 'llubi-interpret')
if llubi_interpret:
    config.substitutions.append(
        ("LLUBI_CHECK", f"{llubi_interpret} %s | filecheck %s --check-prefix=LLUBI"))
    config.substitutions.append(
        (r"(?<!=)\bLLUBI\b(?!_)", f"{llubi_interpret} %s | filecheck %s"))
    config.substitutions.append(("%llubi-interpret", llubi_interpret))
else:
    config.substitutions.append(("LLUBI_CHECK", "true"))
    config.substitutions.append((r"(?<!=)\bLLUBI\b(?!_)", "true"))

alive_interpret = cross_check_tool('alive-exec', 'alive-interpret')
if alive_interpret:
    config.substitutions.append(
        ("ALIVE_EXEC_CHECK", f"{alive_interpret} %s | filecheck %s --check-prefix=ALIVE_EXEC"))
    config.substitutions.append(
        (r"(?<!=)\bALIVE_EXEC\b(?!_)", f"{alive_interpret} %s | filecheck %s"))
else:
    config.substitutions.append(("ALIVE_EXEC_CHECK", "true"))
    config.substitutions.append((r"(?<!=)\bALIVE_EXEC\b(?!_)", "true"))

mlir_opt = lit.util.which('mlir-opt')
mlir_versions_supported = ['22', '23', '24']

result = subprocess.run(['lake', 'build'], cwd =veir_root)

if mlir_opt:
  result = subprocess.run([mlir_opt, '--version'], capture_output=True, text=True)
  version = "unknown"
  version_short = "unknown"
  match = re.search(r'version\s+([a-zA-Z0-9\.]+)', str(result))
  if match:
    version = match.group(1)
    version_short = version[0:2]

  if version_short in mlir_versions_supported:
    print(f"'mlir-opt' version {version_short} ({version}) detected. Running MLIR compatibility tests")
    # Ops that only exist in newer `mlir-opt` can gate their MLIR round-trip on
    # a minimum version, e.g. `// RUN: %if mlir-min-23 %{ MLIR_ROUNDTRIP %}`.
    for _v in mlir_versions_supported:
      if int(version_short) >= int(_v):
        config.available_features.add(f"mlir-min-{_v}")
    config.substitutions.append(("MLIR_ROUNDTRIP",
     f"mlir-opt --mlir-print-op-generic --mlir-print-local-scope %s | .lake/build/bin/veir-opt{exe_suffix} | mlir-opt --mlir-print-op-generic --mlir-print-local-scope | .lake/build/bin/veir-opt{exe_suffix} --print-op-generic | filecheck %s"))
    config.substitutions.append(("MLIR_UNREGISTERED_ROUNDTRIP",
     f"mlir-opt --mlir-print-op-generic --mlir-print-local-scope --allow-unregistered-dialect %s | .lake/build/bin/veir-opt{exe_suffix} --allow-unregistered-dialect | mlir-opt --mlir-print-op-generic --mlir-print-local-scope --allow-unregistered-dialect | .lake/build/bin/veir-opt{exe_suffix} --print-op-generic --allow-unregistered-dialect | filecheck %s"))
    # Assert that `mlir-opt` rejects the input. We only check that it fails
    # (non-zero exit), not the exact diagnostic, since:
	# 1. The message might not be stable across `mlir-opt` versions.
	# 2. Tests that use MLIR_INVALID to ensure parsing behavior equivalence
	#    usually uses VEIR_ROUNDTRIP too, but we can only check one of the error
	#    messages. We'd rather test the error message of `veir-opt`.
    config.substitutions.append(("MLIR_INVALID",
     "not mlir-opt --mlir-print-op-generic --mlir-print-local-scope %s"))
    # As MLIR_INVALID, but for inputs that contain unregistered operations,
    # which `mlir-opt` would otherwise reject before reaching the check under
    # test.
    config.substitutions.append(("MLIR_UNREGISTERED_INVALID",
     "not mlir-opt --mlir-print-op-generic --mlir-print-local-scope --allow-unregistered-dialect %s"))
  else:
    print(f"'mlir-opt' version {version_short} ({version}) detected, but only {mlir_versions_supported} supported. Skipping MLIR compatibility tests")
    config.substitutions.append(("MLIR_ROUNDTRIP", "true"))
    config.substitutions.append(("MLIR_UNREGISTERED_ROUNDTRIP", "true"))
    config.substitutions.append(("MLIR_INVALID", "true"))
    config.substitutions.append(("MLIR_UNREGISTERED_INVALID", "true"))
else:
  config.substitutions.append(("MLIR_ROUNDTRIP", "true"))
  config.substitutions.append(("MLIR_UNREGISTERED_ROUNDTRIP", "true"))
  config.substitutions.append(("MLIR_INVALID", "true"))
  config.substitutions.append(("MLIR_UNREGISTERED_INVALID", "true"))
