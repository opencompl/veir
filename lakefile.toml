name = "VeIR"
version = "0.1.0"
defaultTargets = ["Veir", "buffed-benchmark", "veir-parse"]
testRunner = "UnitTest"
buildType = "release"
moreLeancArgs = ["-flto=full"]
moreLinkArgs = ["-flto=full"]
moreLeanArgs = ["--tstack=400000"]
moreServerArgs = ["--tstack=400000"]

[[require]]
name = "ExArray"
path = "ExArray"

[[lean_lib]]
name = "Veir"
root = "Veir"

[[lean_lib]]
name = "UnitTest"
root = "UnitTest"

[[lean_exe]]
name = "buffed-benchmark"
root = "BuffedBenchmark"

[[lean_exe]]
name = "veir-parse"
root = "VeirParse"

[[lean_exe]]
name = "allocator-tests"
root = "AllocatorTests"

[[lean_exe]]
name = "ir-reuse-tests"
root = "IRReuseTests"

[[lean_exe]]
name = "parser-tests"
root = "ParserTests"
