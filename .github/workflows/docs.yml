name: Docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # `doc-gen4` needs several GB per module and Lake runs one job per core, so
    # the profile's 32 cores would start 32 of them and run out of memory.
    runs-on: namespace-profile-veir
    env:
      LEAN_NUM_THREADS: 4
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cache action skips paths that do not exist, and still passes.
      - name: Create the build directories
        run: mkdir -p .lake ExArray/.lake lean-ctrees/.lake

      # The profile's cache volume, which `buildns` fills with a release build.
      - name: Set up caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.elan
            ${{ github.workspace }}/.lake
            ${{ github.workspace }}/ExArray/.lake
            ${{ github.workspace }}/lean-ctrees/.lake

      # Only installs elan; docgen-action builds the docs itself. lean-action
      # saves its cache before docgen-action runs, so its own cache would be
      # empty.
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          use-github-cache: false

      # docgen-action builds `<target>:docs` for every default target, and
      # executables have no `docs` facet. The `grep` fails the job if the
      # field is ever reworded and the substitution silently matches nothing.
      - name: Restrict default targets to the library
        run: |
          sed -i 's/^defaultTargets = .*$/defaultTargets = ["Veir"]/' lakefile.toml
          grep -qx 'defaultTargets = \["Veir"\]' lakefile.toml

      - uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # main, 2026-10-05
        with:
          build-page: false
