name: Docs

on:
  push:
    branches: [main]

permissions:
  # To delete the site artifacts of earlier attempts, see below.
  actions: write
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs:
    # `doc-gen4` needs several GB per module and Lake runs one job per core, so
    # the profile's 32 cores would start 32 of them and run out of memory.
    runs-on: namespace-profile-veir
    env:
      LEAN_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The cache action skips paths that do not exist, and still passes.
      - name: Create the build directories
        run: mkdir -p .lake ExArray/.lake lean-ctrees/.lake

      # The profile's cache volume, which `buildns` fills with a release build.
      - name: Set up caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.elan
            ${{ github.workspace }}/.lake
            ${{ github.workspace }}/ExArray/.lake
            ${{ github.workspace }}/lean-ctrees/.lake

      # Only installs elan; docgen-action builds the docs itself. lean-action
      # saves its cache before docgen-action runs, so its own cache would be
      # empty.
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          use-github-cache: false

      # docgen-action builds `<target>:docs` for every default target, and
      # executables have no `docs` facet. The `grep` fails the job if the
      # field is ever reworded and the substitution silently matches nothing.
      - name: Restrict default targets to the library
        run: |
          sed -i 's/^defaultTargets = .*$/defaultTargets = ["Veir"]/' lakefile.toml
          grep -qx 'defaultTargets = \["Veir"\]' lakefile.toml

      # Every attempt of this job uploads a `github-pages` artifact, and
      # `deploy-pages` refuses to deploy when the run holds more than one.
      # Delete the artifacts of earlier attempts so a re-run of all jobs can
      # deploy.
      - name: Delete the site artifacts of earlier attempts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, name: 'github-pages' });
            for (const artifact of artifacts) {
              core.info(`Deleting artifact ${artifact.id}`);
              await github.rest.actions.deleteArtifact(
                { ...context.repo, artifact_id: artifact.id });
            }

      # The action would deploy right after its upload, and `deploy-pages` looks
      # the artifact up only once. Half a second after the upload, that lookup
      # sometimes came back empty and failed the run. The `deploy` job below
      # deploys instead.
      - uses: leanprover-community/docgen-action@dacc1acc2a3f532cc577266979ba9c36c7593f7c # main, 2026-10-05
        with:
          build-page: false
          deploy: false

      # `deploy: false` also turns off the upload of the action, which writes
      # the site to `docs/`.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  # A separate job starts some seconds after the upload, which gives the
  # artifact time to show up in the lookup. "Re-run failed jobs" then also
  # repeats a failed deployment without rebuilding the documentation. The
  # artifact expires after one day; after that, re-run all jobs.
  deploy:
    needs: docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
