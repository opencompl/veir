name: Nightly veir-tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  veir-tests:
    runs-on: ubuntu-latest
    

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build veir
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build-args: "--iofail"

      - name: Install LLVM tools
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y mlir-20-tools
          echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

      - name: Clone veir-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opencompl/veir-tests
          path: veir-tests

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run veir-tests
        env:
          VEIR_DIR: ${{ github.workspace }}
        run: |
          cd veir-tests
          ./scripts/run-test.sh
