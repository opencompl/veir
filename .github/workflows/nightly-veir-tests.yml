name: Nightly veir-tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  veir-tests:
    runs-on: ubuntu-latest
    

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build veir
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build-args: "--iofail"

      - name: Install LLVM tools
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y mlir-20-tools
          echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

      - name: Clone veir-tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opencompl/veir-tests
          path: veir-tests

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Run veir-tests
        env:
          VEIR_DIR: ${{ github.workspace }}
        run: |
          cd veir-tests
          ./scripts/run-test.sh
