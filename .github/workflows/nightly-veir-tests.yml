name: Nightly veir-tests

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  veir-tests:
    runs-on: ubuntu-latest
    

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build veir
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build-args: "--iofail"

      - name: Install LLVM tools
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 20
          sudo apt-get install -y mlir-20-tools
          echo "/usr/lib/llvm-20/bin" >> $GITHUB_PATH

      - name: Clone veir-tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: opencompl/veir-tests
          path: veir-tests

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'

      - name: Run veir-tests
        env:
          VEIR_DIR: ${{ github.workspace }}
        run: |
          cd veir-tests
          ./scripts/run-test.sh
