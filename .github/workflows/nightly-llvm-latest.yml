name: Nightly LLVM latest

# Rebuilds the floating runner image and runs the test suite on it, so that an
# LLVM release that breaks us is reported here rather than when the pinned image
# of `lean_action_ci_namespace.yml` is next moved forward.
#
# The rebuild is its own job on a GitHub-hosted runner, since it cannot run on
# the profile it is rebuilding. Namespace distributes and optimizes a new image
# before runners on that profile start, so the test job may wait a while for
# one.

on:
  schedule:
    # After the LLVM release process usually settles, and clear of the 06:00
    # `nightly-veir-tests.yml` run.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  # `nscloud-setup` exchanges a GitHub OIDC token for a short-lived Namespace
  # one, so there is no pre-shared key to keep.
  id-token: write
  contents: read

env:
  # The tag of the runner profile, which is also the half of `runs-on` that
  # follows `namespace-profile-`. The commands below want the profile's id
  # instead, and look it up from this, so there is no id to keep anywhere.
  PROFILE_TAG: veir-llvm-latest

jobs:
  rebuild-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: namespacelabs/nscloud-setup@df198f982fcecfb8264bea3f1274b56a61b6dfdc # v0.0.12

      - name: Find the profile
        run: |
          profile_id=$(nsc github profile list -o json \
            | jq -r --arg tag "$PROFILE_TAG" '.[] | select(.tag == $tag) | .profile_id')
          test -n "$profile_id" || { echo "no runner profile tagged $PROFILE_TAG"; exit 1; }
          echo "PROFILE_ID=$profile_id" >> "$GITHUB_ENV"

      # The Dockerfile in the repository is the profile's, rather than a copy
      # to paste into the dashboard. Applying it every night keeps the two from
      # drifting apart, and is a no-op when the file has not changed.
      - name: Apply the Dockerfile to the profile
        run: |
          nsc github profile update \
            --profile_id "$PROFILE_ID" \
            --dockerfile .github/docker/namespace-llvm-latest-image.Dockerfile

      # An unchanged Dockerfile does not rebuild on its own, and an unchanged
      # Dockerfile is the normal case here: what moves is the LLVM release that
      # the build resolves. So the rebuild is asked for explicitly.
      - name: Rebuild the base image
        run: |
          nsc github profile rebuild-base-image --profile_id "$PROFILE_ID"

  test:
    needs: rebuild-image
    runs-on: namespace-profile-veir-llvm-latest

    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Activate the Nix development environment
        uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: --no-write-lock-file

      - name: Create the build directories
        run: mkdir -p .lake ExArray/.lake lean-ctrees/.lake

      # The cache volume belongs to the profile, so this one is separate from
      # the pinned profile's without having to be asked for.
      - name: Set up caches
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/.elan
            ${{ github.workspace }}/.lake
            ${{ github.workspace }}/ExArray/.lake
            ${{ github.workspace }}/lean-ctrees/.lake

      - name: Build and test the project
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          build-args: "--iofail"
          test-args: "--iofail"
          test: true
          use-github-cache: false

      # Without `-Dforce-cross-checks=1` this job would be worth nothing: the
      # tools are built against whichever LLVM is newest, `Test/lit.cfg` pins
      # them to the versions of the other image, and every cross-check would
      # skip itself while the run stayed green.
      - name: Run filecheck tests against the latest LLVM
        run: lit Test/ -v -Dforce-cross-checks=1
