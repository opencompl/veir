name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build docs
        continue-on-error: true
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: "docbuild"
          build-args: "Veir:docs"

      - name: Upload docs artifact
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs
          path: docbuild/.lake/build/doc/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Download docs artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: docs
          path: docs-content

      - name: Merge docs into gh-pages (preserving dev/)
        continue-on-error: true
        run: |
          # Remove old docs but keep dev/ (benchmarks) and .git/
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'dev' ! -name 'docs-content' -exec rm -rf {} +
          # Copy fresh docs into root
          cp -r docs-content/* . ; true
          rm -rf docs-content

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No docs changes to deploy" && exit 0
          git commit -m "Deploy docs for ${{ github.sha }}"
          git pull --rebase origin gh-pages
          git push origin gh-pages
