name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build docs
        continue-on-error: true
        uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1.6.0
        with:
          lake-package-directory: "docbuild"
          build-args: "Veir:docs"

      - name: Upload docs artifact
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs
          path: docbuild/.lake/build/doc/

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages

      - name: Download docs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: docs
          path: docs-content

      - name: Merge docs into gh-pages (preserving dev/)
        continue-on-error: true
        run: |
          # Remove old docs but keep dev/ (benchmarks) and .git/
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'dev' ! -name 'docs-content' -exec rm -rf {} +
          # Copy fresh docs into root
          cp -r docs-content/* . ; true
          rm -rf docs-content

      - name: Push to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No docs changes to deploy" && exit 0
          git commit -m "Deploy docs for ${{ github.sha }}"
          git pull --rebase origin gh-pages
          git push origin gh-pages
