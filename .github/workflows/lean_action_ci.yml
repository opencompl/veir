name: Buffered VeIR CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

env:
  LEAN_CC: ${{ github.workspace }}/Tools/lean-clang

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        buildType: [release, debug]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select the debug build type
        if: matrix.buildType == 'debug'
        run: |
          sed -i 's/^buildType = "release"$/buildType = "debug"/' lakefile.toml
          grep -qx 'buildType = "debug"' lakefile.toml

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1.2.1
        with:
          arguments: --no-write-lock-file

      - name: Build buffered VeIR
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          build-args: "--iofail"
          test: false
          use-github-cache: false

      - name: Run proof and native tests
        run: |
          lake test --iofail
          lake build parser-tests allocator-tests ir-allocation-tests --iofail
          lake exe parser-tests
          lake exe allocator-tests
          lake exe ir-allocation-tests
          uv run python Tools/check-orphan-modules
          uv run python Tools/check-buffed-wrapper-codegen
          uv run python Tools/check-parser-cli

      - name: Test ExArray
        working-directory: ExArray
        run: lake exe test
